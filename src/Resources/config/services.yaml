services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Guycollegmbh\ApartmentsBundle\:
        resource: '../../'
        exclude: '../../{DependencyInjection,Resources}'

    Guycollegmbh\ApartmentsBundle\Module\ApartmentsModule:
        arguments:
            $connection: '@database_connection'
            $scopeMatcher: '@contao.routing.scope_matcher'
            $requestStack: '@request_stack'
        tags:
            - name: 'contao.frontend_module'
              category: 'miscellaneous'
              type: 'apartments'