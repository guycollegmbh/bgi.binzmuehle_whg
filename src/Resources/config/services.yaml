services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Guycollegmbh\ApartmentsBundle\:
        resource: '../../'
        exclude: '../../{DependencyInjection,Resources}'

    # Frontend Module Controllers werden automatisch erkannt durch #[AsFrontendModule]
    Guycollegmbh\ApartmentsBundle\Controller\FrontendModule\:
        resource: '../../Controller/FrontendModule'
        tags: ['controller.service_arguments']